# Project-wide Gradle settings.

# Enables AndroidX support across all dependencies
android.useAndroidX=true

# Faster and namespaced R classes
android.nonTransitiveRClass=true

# JVM memory configuration for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable R8 full mode to prevent generic signature stripping for Retrofit suspend functions
android.enableR8.fullMode=false
